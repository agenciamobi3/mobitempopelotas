name: Qualidade

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, build, rotas, typecheck, lint e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Hierarquia Defesa Civil e SACE
        run: node --test tests/hydrology-sace-complementary-order.test.ts

      - name: Contratos rápidos
        run: |
          mkdir -p artifacts/contract-tests
          set +e
          npm run test:contracts 2>&1 | tee artifacts/contract-tests/test-contracts.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Histórico documentado da cheia de 2001
        run: node --test tests/flood-2001-historical-page.test.ts

      - name: Histórico documentado da cheia de 2015
        run: node --test tests/flood-2015-historical-page.test.ts

      - name: Linguagem acessível do arquivo de enchentes
        run: node --test tests/flood-visitor-copy.test.ts

      - name: Índice de pesquisa das enchentes
        run: node --test tests/flood-history-index.test.ts

      - name: Colaboração comunitária do arquivo histórico
        run: node --test tests/historical-collaboration.test.ts

      - name: Moderação do arquivo histórico
        run: node --test tests/historical-moderation.test.ts

      - name: Histórico do status de dados
        run: node --test tests/data-status-history.test.ts

      - name: Resiliência das rotas públicas
        run: node --test tests/public-route-resilience.test.ts

      - name: Navegação editorial e megamenu
        run: node --test tests/editorial-megamenu-navigation.test.ts

      - name: Teclado e foco do header
        run: node --test tests/header-keyboard-accessibility.test.ts

      - name: Footer editorial e proveniência
        run: node --test tests/footer-editorial-navigation.test.ts

      - name: Shell global do portal
        run: node --test tests/global-shell-consistency.test.ts

      - name: Analytics e comunicação
        run: node --test tests/analytics-communication-runtime.test.ts

      - name: Faixa de utilidade pública
        run: node --test tests/footer-public-service.test.ts

      - name: Fotografias locais do hero
        run: node --test tests/home-hero-local-photos.test.ts

      - name: Câmera ao vivo diferida da Home
        run: node --test tests/home-live-camera-hero.test.ts

      - name: Overlay de navegação
        run: node --test tests/route-loading-overlay.test.ts

      - name: Cache estático do service worker
        run: node --test tests/service-worker-static-cache.test.ts

      - name: Integridade do raster REDEMET
        run: node --test tests/redemet-raster-render-state.test.ts

      - name: Fontes de satélite
        run: node --test tests/satellite-source-selector.test.ts

      - name: Hidrologia diferida da Home
        run: node --test tests/home-deferred-hydrology.test.ts

      - name: Semântica dos estados degradados da hidrologia
        run: node --test tests/hydrology-degraded-state-semantics.test.ts

      - name: Contrato visual dos gráficos de nível
        run: |
          node --test tests/hydrology-level-chart-contract.test.ts
          node --test tests/hydrology-level-movement.test.ts
          node --test tests/hydrology-level-series.test.ts

      - name: Snapshot estável da página hidrológica
        run: node --test tests/hydrology-loader-stable-weather.test.ts

      - name: Fonte local do Laranjal e contingência CIEX/FURG
        run: >-
          node --import ./scripts/test-node-resolver.mjs --test
          tests/laranjal-ciex-furg-fallback.test.ts
          tests/laranjal-last-known-fallback.test.ts
          tests/laranjal-public-provenance.test.ts

      - name: Localidades hidrológicas da Lagoa
        run: node --test tests/hydrology-localities.test.ts

      - name: Boundaries locais e mapas hidrológicos
        run: node --test tests/hydrology-local-boundaries.test.ts

      - name: Inventário Defesa Civil RS
        run: node --test tests/defesa-civil-inventory.test.ts

      - name: Módulo regional Defesa Civil RS
        run: node --test tests/regional-defesa-civil-module.test.ts

      - name: Links dedicados Defesa Civil RS
        run: node --test tests/defesa-civil-dedicated-links.test.ts

      - name: Arquivo rico de previsões
        run: node --test tests/forecast-rich-runs.test.ts

      - name: Contrato Weather AI
        run: node --test tests/weather-ai-snapshots.test.ts

      - name: Verificar árvore de rotas versionada
        run: npm run routes:check

      - name: Build de produção
        run: npm run build

      - name: Medir peso dos assets do build
        run: npm run quality:assets

      - name: Contrato das rotas públicas
        run: npm run test:routes

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint incremental
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/lint-changed.mjs

      - name: Iniciar preview de produção
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tempo-pelotas-preview.log 2>&1 &
          echo $! > /tmp/tempo-pelotas-preview.pid
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tempo-pelotas-preview.log
          exit 1

      - name: Acessibilidade, responsividade e Web Vitals de laboratório
        env:
          CANDIDATE_URL: http://127.0.0.1:4173
          QUALITY_PERF_STRICT: "false"
        run: npm run quality:browser

      - name: Salvar relatórios de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.sha }}
          path: |
            artifacts/build-assets
            artifacts/browser-quality
            artifacts/contract-tests
          if-no-files-found: warn
          retention-days: 14

      - name: Encerrar preview de produção
        if: always()
        run: |
          if [ -f /tmp/tempo-pelotas-preview.pid ]; then
            kill "$(cat /tmp/tempo-pelotas-preview.pid)" 2>/dev/null || true
          fi
