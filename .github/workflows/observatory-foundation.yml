name: Observatório — Fundação

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/observatory-foundation.yml"
      - "src/observatory/**"
      - "src/routes/observatorio.tsx"
      - "src/lib/auth/account-access.ts"
      - "src/components/auth/GoogleLoginCard.tsx"
      - "src/components/layout/SiteLayout.tsx"
      - "PROJECT_CURRENT_STATE.md"
      - "docs/TEMPO_PELOTAS_OBSERVATORIO_*.md"
      - "tests/observatory-foundation.test.ts"
      - "tests/observatory-timeline.test.ts"
      - "tests/observatory-interface.test.ts"
      - "tests/observatory-scenario.test.ts"
      - "tests/account-access-entitlements.test.ts"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "vite.config.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/observatory-foundation.yml"
      - "src/observatory/**"
      - "src/routes/observatorio.tsx"
      - "src/lib/auth/account-access.ts"
      - "src/components/auth/GoogleLoginCard.tsx"
      - "src/components/layout/SiteLayout.tsx"
      - "PROJECT_CURRENT_STATE.md"
      - "docs/TEMPO_PELOTAS_OBSERVATORIO_*.md"
      - "tests/observatory-foundation.test.ts"
      - "tests/observatory-timeline.test.ts"
      - "tests/observatory-interface.test.ts"
      - "tests/observatory-scenario.test.ts"
      - "tests/account-access-entitlements.test.ts"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    name: Acesso, rotas, tipos e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar árvore de rotas
        run: npm run routes:generate

      - name: Contratos do Observatório
        id: contracts
        run: >-
          node --import ./scripts/test-node-resolver.mjs --test
          tests/account-access-entitlements.test.ts
          tests/observatory-foundation.test.ts
          tests/observatory-timeline.test.ts
          tests/observatory-interface.test.ts
          tests/observatory-scenario.test.ts

      - name: Sincronizar routeTree versionada
        if: ${{ github.event_name == 'push' && steps.contracts.outcome == 'success' }}
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "routeTree já está sincronizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore(routes): registrar rota do Observatório"
          git push origin HEAD:main

      - name: TypeScript
        id: typecheck
        run: npm run typecheck

      - name: Build de produção
        if: ${{ always() && steps.contracts.outcome == 'success' }}
        run: npm run build

      - name: Guardar routeTree gerada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-route-tree-${{ github.sha }}
          path: src/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 3
