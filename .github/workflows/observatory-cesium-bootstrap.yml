name: Observatório — Bootstrap Cesium

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/observatory-cesium-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Instalar e versionar Cesium
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Cesium fixado
        run: npm install --save-exact cesium@1.145.0 --no-audit --no-fund

      - name: Atualizar bun.lock
        run: bun install --lockfile-only

      - name: Validar npm ci
        run: npm ci --no-audit --no-fund

      - name: Validar versão
        run: node -e "const p=require('./node_modules/cesium/package.json'); if(p.version!=='1.145.0') process.exit(1); console.log('Cesium', p.version)"

      - name: Versionar manifests e lockfiles
        run: |
          if git diff --quiet -- package.json package-lock.json bun.lock; then
            echo "Cesium já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json bun.lock
          git commit -m "build(observatorio): instalar Cesium 1.145.0"
          git push origin HEAD:main
